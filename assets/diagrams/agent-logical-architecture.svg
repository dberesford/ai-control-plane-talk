<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
<title id="title">An agent connects goals, reasoning, actions and feedback</title><desc id="desc">A human or system supplies a task through an interface. Inside the logical agent boundary, goals guide reasoning, reasoning calls an external foundation model and selects actions, and environment feedback updates state for subsequent reasoning.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0L10 4L0 8Z" fill="#1B3139"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#1B3139;font-size:23px} .label{font-size:20px;paint-order:stroke;stroke:#F0EFE9;stroke-width:7px;stroke-linejoin:round} .box{fill:white;stroke:#1B3139;stroke-width:2} .line{fill:none;stroke:#1B3139;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1600" height="850" fill="#F0EFE9"/>
<rect x="470" y="35" width="650" height="760" fill="none" stroke="#1B3139" stroke-width="2" stroke-dasharray="10 7"/>
<text x="495" y="77" font-weight="600">Agent (logical boundary)</text>
<rect class="box" x="35" y="130" width="230" height="95"/>
<text text-anchor="middle" x="150.0" y="185.5">Human or system</text>
<rect class="box" x="35" y="325" width="230" height="100"/>
<text text-anchor="middle" x="150.0" y="368.0">Interface</text>
<text text-anchor="middle" x="150.0" y="398.0">UI / API / events</text>
<rect class="box" x="650" y="120" width="380" height="85"/>
<text text-anchor="middle" x="840.0" y="170.5">Goals</text>
<rect class="box" x="650" y="310" width="380" height="115" style="stroke:#FF8400;stroke-width:3"/>
<text text-anchor="middle" x="840.0" y="360.5">Reasoning</text>
<text text-anchor="middle" x="840.0" y="390.5">Choose the next action</text>
<rect class="box" x="650" y="520" width="380" height="90"/>
<text text-anchor="middle" x="840.0" y="573.0">Action / tool invocation</text>
<rect class="box" x="510" y="675" width="340" height="85"/>
<text text-anchor="middle" x="680.0" y="725.5">State / memory</text>
<rect class="box" x="1240" y="310" width="325" height="115"/>
<text text-anchor="middle" x="1402.5" y="375.5">Foundation model</text>
<rect class="box" x="1240" y="520" width="325" height="90"/>
<text text-anchor="middle" x="1402.5" y="558.0">Environment</text>
<text text-anchor="middle" x="1402.5" y="588.0">External systems</text>
<path class="line" d="M100 225 V325"/>
<text class="label" x="42" y="280">Task</text>
<path class="line" d="M210 325 V225"/>
<text class="label" x="225" y="280">Result</text>
<path class="line" d="M265 350 H380 V162 H650"/>
<text class="label" x="390" y="149">Task / goal</text>
<path class="line" d="M650 393 H265"/>
<text class="label" x="335" y="422">Response</text>
<path class="line" d="M840 205 V310"/>
<path class="line" d="M1030 340 H1240"/>
<text class="label" x="1080" y="325">Model call</text>
<path class="line" d="M1240 400 H1030"/>
<text class="label" x="1060" y="439">Model response</text>
<path class="line" d="M840 425 V520"/>
<text class="label" x="857" y="481">Selects</text>
<path class="line" d="M1030 563 H1240"/>
<text class="label" x="1080" y="547">Acts upon</text>
<path class="line" d="M1400 610 V718 H850"/>
<text class="label" x="1030" y="698">Feedback / observations</text>
<path class="line" d="M585 675 V367 H650"/>
<text class="label" x="490" y="643">State for next step</text>
</svg>