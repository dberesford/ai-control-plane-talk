<text x="900.8" y="409" font-size="24" font-weight="600" fill="#1B3139">208 (58%)</text></g>
<g data-scope="Each event" data-count="29">
<text x="44" y="488" font-size="24" font-weight="600" fill="#1B3139">Each event</text>
<text x="44" y="516" font-size="20" fill="#1B3139">Incident, change or challenge</text>
<rect x="340" y="460" width="75.4" height="44" fill="#1B3139" fill-opacity="0.16" stroke="#1B3139"/>
<text x="435.4" y="489" font-size="24" font-weight="600" fill="#1B3139">29 (8%)</text></g>
<text x="1064" y="560" font-size="20" fill="#1B3139">Controls</text>
</svg>
