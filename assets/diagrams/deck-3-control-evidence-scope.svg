<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" width="1280" height="590" role="img" aria-labelledby="control-evidence-scope-title control-evidence-scope-desc" font-family="Inter, Helvetica Neue, Arial, sans-serif" id="control-evidence-scope-root">
<title id="control-evidence-scope-title">Control evidence grouped by scope</title>
<desc id="control-evidence-scope-desc">Of 356 catalogue controls, 208 need evidence for each use case, compared with 47 shared across use cases, 55 platform decisions, 17 model decisions and 29 event controls.</desc>
<defs/>
      <style>#control-evidence-scope-root { --color-paper:   #F0EFE9;   
      --color-ink:     #1B3139;   
      --color-muted:   #1B3139;   
      --color-accent:  #FF8400;   
      --font-sans:     'Inter', 'Helvetica Neue', Arial, sans-serif;
      --font-serif:    'Inter', 'Helvetica Neue', Arial, sans-serif;
      --font-mono:     'Inter', 'Helvetica Neue', Arial, sans-serif; }
      #control-evidence-scope-root { font-family: var(--font-sans); color: var(--color-ink); }
      #control-evidence-scope-root .diagram-container { width: 100%; overflow-x: auto; }
      #control-evidence-scope-root .diagram-container { overflow-x: visible; }</style>
<!-- D3-26: Copy for Deck 3 with the footer section removed at Damian's request, 15-OCT-2026. D2-15: Original aggregation of I-D2-02 reuse.svg, snapshot 11-OCT-2026. Five scope totals preserved; the domain matrix remains linked from slide 19. Source scope order, not ranking. Counts classify controls, not evidence records or measured savings. -->
<rect width="1280" height="590" fill="#F0EFE9"/>
<text x="44" y="56" font-size="30" font-weight="600" fill="#1B3139">Evidence scope across 356 catalogue controls</text>
<line x1="340" y1="128" x2="340" y2="528" stroke="#1B3139" stroke-opacity="0.45"/>
<text x="340" y="560" font-size="20" text-anchor="middle" fill="#1B3139">0</text>
<line x1="470" y1="128" x2="470" y2="528" stroke="#1B3139" stroke-opacity="0.12"/>
<text x="470" y="560" font-size="20" text-anchor="middle" fill="#1B3139">50</text>
<line x1="600" y1="128" x2="600" y2="528" stroke="#1B3139" stroke-opacity="0.12"/>
<text x="600" y="560" font-size="20" text-anchor="middle" fill="#1B3139">100</text>
<line x1="730" y1="128" x2="730" y2="528" stroke="#1B3139" stroke-opacity="0.12"/>
<text x="730" y="560" font-size="20" text-anchor="middle" fill="#1B3139">150</text>
<line x1="860" y1="128" x2="860" y2="528" stroke="#1B3139" stroke-opacity="0.12"/>
<text x="860" y="560" font-size="20" text-anchor="middle" fill="#1B3139">200</text>
<line x1="990" y1="128" x2="990" y2="528" stroke="#1B3139" stroke-opacity="0.12"/>
<text x="990" y="560" font-size="20" text-anchor="middle" fill="#1B3139">250</text>
<g data-scope="Shared across use cases" data-count="47">
<text x="44" y="168" font-size="24" font-weight="600" fill="#1B3139">Shared across use cases</text>
<text x="44" y="196" font-size="20" fill="#1B3139">Organisation, supplier, service</text>
<rect x="340" y="140" width="122.2" height="44" fill="#1B3139" fill-opacity="0.16" stroke="#1B3139"/>
<text x="482.2" y="169" font-size="24" font-weight="600" fill="#1B3139">47 (13%)</text></g>
<g data-scope="The platform" data-count="55">
<text x="44" y="248" font-size="24" font-weight="600" fill="#1B3139">The platform</text>
<text x="44" y="276" font-size="20" fill="#1B3139">From each live request</text>
<rect x="340" y="220" width="143" height="44" fill="#1B3139" fill-opacity="0.16" stroke="#1B3139"/>
<text x="503" y="249" font-size="24" font-weight="600" fill="#1B3139">55 (15%)</text></g>
<g data-scope="Each model" data-count="17">
<text x="44" y="328" font-size="24" font-weight="600" fill="#1B3139">Each model</text>
<text x="44" y="356" font-size="20" fill="#1B3139">Signed model decision</text>
<rect x="340" y="300" width="44.2" height="44" fill="#1B3139" fill-opacity="0.16" stroke="#1B3139"/>
<text x="404.2" y="329" font-size="24" font-weight="600" fill="#1B3139">17 (5%)</text></g>
<g data-scope="Each use case" data-count="208">
<text x="44" y="408" font-size="24" font-weight="600" fill="#1B3139">Each use case</text>
<text x="44" y="436" font-size="20" fill="#1B3139">Tests, records and decisions</text>
<rect x="340" y="380" width="540.8" height="44" fill="#FF8400" stroke="#1B3139"/>
<rect x="340" y="380" width="234" height="44" fill="#FFE8CE" stroke="#1B3139"/>
<text x="457" y="409" text-anchor="middle" font-size="22" font-weight="600" fill="#1B3139">90 automated</text>
