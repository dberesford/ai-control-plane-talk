<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .name { font-size: 16px; font-weight: 600; fill: #111827; }
    .sub { font-size: 13px; fill: #6b7280; }
    .area { font-size: 13px; font-weight: 600; fill: #6b7280; letter-spacing: 0.04em; }
    .key { font-size: 13px; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.3; }
    .badge { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .agent { stroke: #374151; fill: none; stroke-width: 2.2; }
    .model { stroke: #2563eb; fill: none; stroke-width: 2.2; }
    .tool { stroke: #16a34a; fill: none; stroke-width: 2.2; }
    .admit { stroke: #ea580c; fill: none; stroke-width: 2.2; }
    .policy { stroke: #7c3aed; fill: none; stroke-width: 2.2; }
    .evidence { stroke: #6b7280; fill: none; stroke-width: 2; stroke-dasharray: 6 4; }
    .ungated { stroke: #9ca3af; fill: none; stroke-width: 2; stroke-dasharray: 2 4; }
  </style>
  <defs>
    <marker id="m-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="m-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="m-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="m-admit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="m-policy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="m-evidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="m-ungated" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
  </defs>

  <rect x="0" y="0" width="1160" height="560" fill="#ffffff"/>

  <!-- the kind cluster -->
  <rect x="170" y="15" width="740" height="530" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="188" y="40" class="area">KIND CLUSTER</text>

  <!-- arrows first, so boxes and badges sit on top -->
  <path d="M140,95 L188,95" class="ungated" marker-end="url(#m-ungated)"/>
  <path d="M360,95 L438,95" class="agent" marker-end="url(#m-agent)"/>
  <path d="M640,75 L958,75" class="model" marker-end="url(#m-model)"/>
  <path d="M640,120 L698,120" class="tool" marker-end="url(#m-tool)"/>
  <path d="M490,132 L490,208" class="model" marker-start="url(#m-model)" marker-end="url(#m-model)"/>
  <path d="M620,132 L620,208" class="policy" marker-start="url(#m-policy)" marker-end="url(#m-policy)"/>
  <path d="M960,240 L742,240" class="policy" marker-end="url(#m-policy)"/>
  <path d="M1050,330 L1050,272" class="policy" marker-end="url(#m-policy)"/>
  <path d="M660,270 L660,338" class="evidence" marker-end="url(#m-evidence)"/>
  <path d="M140,495 L188,495" class="admit" marker-end="url(#m-admit)"/>
  <path d="M362,495 L438,495" class="admit" marker-start="url(#m-admit)" marker-end="url(#m-admit)"/>
  <path d="M275,460 L275,370 L578,370" class="evidence" marker-end="url(#m-evidence)"/>

  <!-- outside the cluster -->
  <rect x="20" y="70" width="120" height="50" rx="8" class="box"/>
  <text x="80" y="100" class="name" text-anchor="middle">Chat</text>
  <rect x="20" y="470" width="120" height="50" rx="8" class="box"/>
  <text x="80" y="500" class="name" text-anchor="middle">kubectl</text>
  <rect x="960" y="45" width="180" height="60" rx="8" class="box"/>
  <text x="1050" y="71" class="name" text-anchor="middle">LM Studio</text>
  <text x="1050" y="91" class="sub" text-anchor="middle">the model</text>
  <rect x="960" y="210" width="180" height="60" rx="8" class="box"/>
  <text x="1050" y="236" class="name" text-anchor="middle">Policy registry</text>
  <text x="1050" y="256" class="sub" text-anchor="middle">signed bundles</text>
  <rect x="960" y="330" width="180" height="60" rx="8" class="box"/>
  <text x="1050" y="356" class="name" text-anchor="middle">foundry-policies</text>
  <text x="1050" y="376" class="sub" text-anchor="middle">make release</text>

  <!-- inside the cluster -->
  <rect x="190" y="60" width="170" height="70" rx="8" class="box"/>
  <text x="275" y="91" class="name" text-anchor="middle">Agents</text>
  <text x="275" y="111" class="sub" text-anchor="middle">eggai-demo</text>
  <rect x="440" y="60" width="200" height="70" rx="8" class="box" style="stroke:#111827;stroke-width:1.8"/>
  <text x="540" y="100" class="name" text-anchor="middle">Agent Router</text>
  <rect x="700" y="95" width="170" height="60" rx="8" class="box"/>
  <text x="785" y="121" class="name" text-anchor="middle">MCP server</text>
  <text x="785" y="141" class="sub" text-anchor="middle">policy lookups</text>
  <rect x="330" y="210" width="190" height="60" rx="8" class="box"/>
  <text x="425" y="236" class="name" text-anchor="middle">Token budget</text>
  <text x="425" y="256" class="sub" text-anchor="middle">rate limiter + Redis</text>
  <rect x="580" y="210" width="160" height="60" rx="8" class="box"/>
  <text x="660" y="246" class="name" text-anchor="middle">OPA</text>
  <rect x="580" y="340" width="160" height="60" rx="8" class="box"/>
  <text x="660" y="366" class="name" text-anchor="middle">Evidence</text>
  <text x="660" y="386" class="sub" text-anchor="middle">registry</text>
  <rect x="190" y="460" width="170" height="70" rx="8" class="box"/>
  <text x="275" y="500" class="name" text-anchor="middle">Kubernetes API</text>
  <rect x="440" y="460" width="200" height="70" rx="8" class="box"/>
  <text x="540" y="500" class="name" text-anchor="middle">Gatekeeper</text>

  <!-- numbered badges, explained in the README -->
  
  
  
  
  
  
  
  
  

  <!-- key -->
  <path d="M960,440 L1000,440" class="model"/><text x="1010" y="444" class="key">model gate</text>
  <path d="M960,462 L1000,462" class="tool"/><text x="1010" y="466" class="key">tool gate</text>
  <path d="M960,484 L1000,484" class="admit"/><text x="1010" y="488" class="key">admission gate</text>
  <path d="M960,506 L1000,506" class="policy"/><text x="1010" y="510" class="key">policy</text>
  <path d="M960,528 L1000,528" class="evidence"/><text x="1010" y="532" class="key">evidence</text>
</svg>
